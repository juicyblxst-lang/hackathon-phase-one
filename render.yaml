services:
  - type: web
    name: hackathon-product-finder
    runtime: python
    plan: free
    buildCommand: "python3 -m py_compile telegram_bot.py"
    startCommand: "python3 telegram_bot.py"
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USER_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
